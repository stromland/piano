version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request a week for everything that is not a major version.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint and vue-tsc do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
